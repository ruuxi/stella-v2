<!doctype html>
<!--
  Stella's launcher window, shared by launcher/{linux,macos,windows}. Each
  launcher shows this page in the platform webview (WebKitGTK, WKWebView,
  WebView2) and embeds it in its binary, so it never depends on the checkout
  the launcher may be recovering. Self-contained: fonts are subset woff2
  data URIs (Cormorant Garamond for the wordmark, Manrope for text) and the
  mark is inline SVG. No network, no external files.

  Native -> page: window.stellaLauncher.render(state), where state is
    {
      platform: "linux" | "macos" | "windows",
      phase: "idle" | "starting" | "running" | "stopping" | "failed",
      status: string,        // starting/stopping: what is happening now
      reason: string,        // failed: one sentence
      output: string[],      // failed: Electron's last lines (Settings > Last error)
      hasKnownGood: boolean, // "Return to last working version" is possible
      version: string        // short HEAD, "" before install
    }
  Any field may be omitted; it keeps its previous value.
  window.stellaLauncher.showSettings(open) opens or closes Settings
  (self-test captures).

  Page -> native: one JSON string per message,
    {"action": "loaded"}      the page can render; show the window now
    {"action": "start"}       idle: start Stella; failed: try again
    {"action": "shutdown"}    running: ask Stella to quit
    {"action": "return"}      return to the last working version, then start
    {"action": "reinstall"}   reinstall, then start
    {"action": "openLogs"}    open the logs folder
    {"action": "close"}       Linux only (undecorated): the close button
    {"action": "drag"}        Linux only: a press on the background; move the window
  through window.webkit.messageHandlers.stella (WebKitGTK, WKWebView) or
  window.chrome.webview (WebView2).
-->

      :root {
        --bg: #fdfdfb;
        --fg: #141413;
        --muted: rgba(20, 20, 19, 0.52);
        --faint: rgba(20, 20, 19, 0.34);
        --hairline: rgba(20, 20, 19, 0.09);
        --ghost: rgba(20, 20, 19, 0.05);
        --ghost-hover: rgba(20, 20, 19, 0.09);
        --primary-bg: #141413;
        --primary-fg: #fdfdfb;
        --primary-hover: #2b2b29;
        --ok: #2fb35a;
        --danger: #c8412f;
        --danger-ghost: rgba(200, 65, 47, 0.08);
        --mark-shadow: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f0d;
          --fg: #f4f3ee;
          --muted: rgba(244, 243, 238, 0.52);
          --faint: rgba(244, 243, 238, 0.32);
          --hairline: rgba(244, 243, 238, 0.09);
          --ghost: rgba(244, 243, 238, 0.06);
          --ghost-hover: rgba(244, 243, 238, 0.11);
          --primary-bg: #f4f3ee;
          --primary-fg: #0f0f0d;
          --primary-hover: #ffffff;
          --ok: #3ccf6a;
          --danger: #ef6b58;
          --danger-ghost: rgba(239, 107, 88, 0.12);
          --mark-shadow: rgba(0, 0, 0, 0.5);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Stella Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: -0.005em;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      button {
        font: inherit;
        color: inherit;
        letter-spacing: inherit;
        border: 0;
        background: none;
        padding: 0;
        cursor: default;
        -webkit-appearance: none;
        appearance: none;
      }
      button:focus {
        outline: none;
      }
      button:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--fg) 35%, transparent);
        outline-offset: 2px;
      }

      /* ── Views ── */
      .view {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        transition:
          opacity 200ms ease,
          transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .view[hidden] {
        display: flex;
        opacity: 0;
        pointer-events: none;
      }
      #home[hidden] {
        transform: translateX(-12px);
      }
      #settings[hidden] {
        transform: translateX(12px);
      }

      /* ── Home ── */
      #home {
        align-items: center;
        justify-content: center;
        padding: 28px 32px 40px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
      }
      .mark {
        width: 68px;
        height: 68px;
        color: var(--fg);
        filter: drop-shadow(0 10px 18px var(--mark-shadow));
      }
      .wordmark {
        font-family: "Stella Display", Georgia, serif;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 112px;
        margin-top: 30px;
      }
      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
        transition:
          opacity 220ms ease,
          transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      body[data-phase="idle"] .panel[data-for~="idle"],
      body[data-phase="starting"] .panel[data-for~="starting"],
      body[data-phase="running"] .panel[data-for~="running"],
      body[data-phase="stopping"] .panel[data-for~="stopping"],
      body[data-phase="failed"] .panel[data-for~="failed"] {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      .pill {
        height: 36px;
        min-width: 132px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 600;
        transition:
          background 140ms ease,
          transform 120ms ease,
          opacity 140ms ease;
      }
      .pill:active:not(:disabled) {
        transform: scale(0.97);
      }
      .pill.primary {
        background: var(--primary-bg);
        color: var(--primary-fg);
      }
      .pill.primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .pill.ghost {
        background: var(--ghost);
        box-shadow: inset 0 0 0 1px var(--hairline);
      }
      .pill.ghost:hover:not(:disabled) {
        background: var(--ghost-hover);
      }
      .pill:disabled {
        opacity: 0.4;
      }

      .note {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.45;
        text-align: center;
        max-width: 290px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent);
      }
      /* Light passing through the label, like the update hold. */
      .shimmer {
        background: linear-gradient(
          90deg,
          var(--faint) 0%,
          var(--faint) 35%,
          var(--fg) 50%,
          var(--faint) 65%,
          var(--faint) 100%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 1.8s linear infinite;
      }
      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -50% 0;
        }
      }

      .failed-title {
        font-size: 13.5px;
        font-weight: 600;
        margin-top: -2px;
      }
      .reason {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-top: -6px;
      }
      .links {
        display: flex;
        gap: 14px;
        margin-top: 2px;
      }
      .link {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        transition: color 140ms ease;
      }
      .link:hover {
        color: var(--fg);
      }

      .icon-button {
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--faint);
        transition:
          color 140ms ease,
          background 140ms ease;
      }
      .icon-button:hover {
        color: var(--fg);
        background: var(--ghost);
      }
      .icon-button svg {
        width: 17px;
        height: 17px;
      }
      #open-settings {
        right: 12px;
        bottom: 12px;
      }
      #close {
        display: none;
        right: 10px;
        top: 10px;
      }
      html[data-platform="linux"] #close {
        display: grid;
      }

      /* ── Settings ── */
      #settings {
        padding: 18px 20px 20px;
      }
      html[data-platform="macos"] #settings {
        padding-top: 38px;
      }
      .settings-head {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        margin-bottom: 10px;
      }
      #close-settings {
        position: static;
        margin-left: -6px;
      }
      .settings-title {
        font-size: 14px;
        font-weight: 600;
      }
      .rows {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        min-height: 0;
        flex: 1;
        margin: 0 -4px;
        padding: 0 4px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 54px;
        padding: 10px 0;
        border-bottom: 1px solid var(--hairline);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .row-label {
        font-size: 13px;
        font-weight: 600;
      }
      .row-hint {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.4;
      }
      .value {
        color: var(--muted);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .pill.small {
        height: 28px;
        min-width: 0;
        padding: 0 13px;
        font-size: 12px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .pill.danger {
        background: var(--danger-ghost);
        color: var(--danger);
        box-shadow: none;
      }
      .log {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 0 0;
      }
      .log[hidden] {
        display: none;
      }
      .log pre {
        margin: 0;
        max-height: 150px;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--ghost);
        box-shadow: inset 0 0 0 1px var(--hairline);
        color: var(--muted);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
        cursor: text;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
        .shimmer {
          color: var(--muted);
          background: none;
        }
      }
    </style>
  </head>
  <body data-phase="idle">
    <main class="view" id="home">
      <div class="brand">
        <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
          <defs>
            <path id="mark-shape" d="M474.1 154.1C269 172.2 211.6 334.4 372.3 442C377.4 445.4 377.7 445.3 362.3 447.8C215.3 471.8 127.8 569.9 162 672.2C210.1 816.2 463.2 910.8 632.5 848C759.2 801 768.8 684.2 653.7 590.5C642.2 581.1 641 582.3 665 579C815.2 558.3 903.1 453.7 861 345.6C815.4 228.5 636.1 139.7 474.1 154.1Z M601 245.4C860.8 283.4 917.2 523.1 678 572.4C638.3 580.6 643.8 581.7 610.7 558.7C582.1 538.9 559 531.1 522.5 529.1C490.2 527.2 464.6 518.6 442.6 502C436.1 497.1 435.7 497 438 501.8C453.8 534.5 450.4 575.2 427.6 626.2C424.8 632.5 425.3 633.5 429.1 629.4C490.6 562.9 565.8 559.2 635 619.2C762 729.4 590.3 855.3 383.2 803.9C190.7 756.1 118.4 604 241.5 505.5C284.9 470.7 369 441.2 388.8 453.8C393 456.5 399.3 460.3 402.8 462.4C406.3 464.4 412.6 468.7 416.8 471.9C454.3 500.4 484.7 512.2 527.5 515C547 516.2 560.7 519.2 575.9 525.4C582.1 527.9 587.3 530 587.5 530C587.7 530 586.3 526.7 584.5 522.7C569.2 489.7 572.5 449.2 594 403.3C597.9 394.9 597.9 394.9 592 400.2C588.7 403.1 582.1 409 577.3 413.3C527.7 457.5 472 461.5 420.7 424.6C326.8 357.2 382.1 259.5 523 244.1C535.9 242.7 588.4 243.6 601 245.4Z" />
            <linearGradient id="mark-core" x1="0" y1="397" x2="0" y2="631" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ff4ac0" />
              <stop offset="0.1" stop-color="#ff45c3" />
              <stop offset="0.2" stop-color="#ff46c0" />
              <stop offset="0.3" stop-color="#a141ff" />
              <stop offset="0.4" stop-color="#703cff" />
              <stop offset="0.5" stop-color="#5243ff" />
              <stop offset="0.6" stop-color="#3164ff" />
              <stop offset="0.7" stop-color="#0e8aff" />
              <stop offset="0.8" stop-color="#00b5ff" />
              <stop offset="0.9" stop-color="#00eeff" />
              <stop offset="1" stop-color="#4ffff7" />
            </linearGradient>
            <radialGradient
              id="mark-fade"
              cx="502"
              cy="539"
              r="112"
              gradientUnits="userSpaceOnUse"
              gradientTransform="translate(502 539) rotate(50) scale(1 3.05) translate(-502 -539)"
            >
              <stop offset="0" stop-color="currentColor" stop-opacity="0.0055" />
              <stop offset="0.0714" stop-color="currentColor" stop-opacity="0.0061" />
              <stop offset="0.1429" stop-color="currentColor" stop-opacity="0.0071" />
              <stop offset="0.2143" stop-color="currentColor" stop-opacity="0.0151" />
              <stop offset="0.2857" stop-color="currentColor" stop-opacity="0.0404" />
              <stop offset="0.3571" stop-color="currentColor" stop-opacity="0.0872" />
              <stop offset="0.4286" stop-color="currentColor" stop-opacity="0.164" />
              <stop offset="0.5" stop-color="currentColor" stop-opacity="0.25" />
              <stop offset="0.5714" stop-color="currentColor" stop-opacity="0.3639" />
              <stop offset="0.6429" stop-color="currentColor" stop-opacity="0.5495" />
              <stop offset="0.7143" stop-color="currentColor" stop-opacity="0.7111" />
              <stop offset="0.7857" stop-color="currentColor" stop-opacity="0.8253" />
              <stop offset="0.8571" stop-color="currentColor" stop-opacity="0.9155" />
              <stop offset="0.9286" stop-color="currentColor" stop-opacity="0.9739" />
              <stop offset="1" stop-color="currentColor" stop-opacity="0.9885" />
            </radialGradient>
          </defs>
          <use href="#mark-shape" fill="url(#mark-core)" />
          <use href="#mark-shape" fill="url(#mark-fade)" />
        </svg>
        <div class="wordmark">Stella</div>
      </div>

      <div class="stage">
        <div class="panel" data-for="idle">
          <button class="pill primary" id="start" data-default>Start</button>
        </div>
        <div class="panel" data-for="starting stopping">
          <div class="status"><span class="shimmer" id="status">Starting Stella…</span></div>
        </div>
        <div class="panel" data-for="running">
          <div class="status"><span class="dot"></span>Stella is running</div>
          <button class="pill ghost" id="shutdown">Shut down</button>
        </div>
        <div class="panel" data-for="failed">
          <div class="failed-title">Stella couldn’t start</div>
          <div class="note reason" id="reason"></div>
          <button class="pill primary" id="retry" data-default>Try again</button>
          <div class="links">
            <button class="link" id="failed-recover">Return to last working version</button>
            <button class="link" id="failed-details">Details</button>
          </div>
        </div>
      </div>

      <button class="icon-button" id="open-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
          <circle cx="16" cy="7" r="2" />
          <circle cx="10" cy="17" r="2" />
        </svg>
      </button>
    </main>

    <section class="view" id="settings" hidden>
      <div class="settings-head">
        <button class="icon-button" id="close-settings" title="Back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <div class="settings-title">Settings</div>
      </div>
      <div class="rows">
        <div class="row">
          <div class="row-text"><div class="row-label">Version</div></div>
          <div class="value" id="version">—</div>
        </div>
        <div class="row">
          <div class="row-text">
            <div class="row-label">Logs</div>
            <div class="row-hint">What Stella and the launcher wrote.</div>
          </div>
          <button class="pill ghost small" id="open-logs">Open</button>
        </div>
        <div class="row">
          <div class="row-text">
            <div class="row-label">Last working version</div>
            <div class="row-hint" id="return-hint">Go back to the last version that started cleanly.</div>
          </div>
          <button class="pill ghost small" id="return">Return</button>
        </div>
        <div class="row">
          <div class="row-text">
            <div class="row-label">Reinstall</div>
            <div class="row-hint" id="reinstall-hint">Download Stella again. Your data stays.</div>
          </div>
          <button class="pill ghost small" id="reinstall">Reinstall</button>
        </div>
        <div class="log" id="log" hidden>
          <div class="row-label">Last error</div>
          <pre id="output"></pre>
        </div>
      </div>
    </section>

    <button class="icon-button" id="close" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M7 7l10 10M17 7L7 17" />
      </svg>
    </button>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const state = {
          platform: "",
          phase: "idle",
          status: "",
          reason: "",
          output: [],
          hasKnownGood: false,
          version: "",
        };
        let confirmingReinstall = false;

        const post = (message) => {
          const text = JSON.stringify(message);
          const handlers = window.webkit && window.webkit.messageHandlers;
          if (handlers && handlers.stella) handlers.stella.postMessage(text);
          else if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(text);
        };

        const settingsOpen = () => !$("settings").hidden;
        const showSettings = (open) => {
          $("settings").hidden = !open;
          $("home").hidden = open;
          if (!open) setConfirming(false);
        };

        const setConfirming = (on) => {
          confirmingReinstall = on;
          $("reinstall").textContent = on ? "Confirm" : "Reinstall";
          $("reinstall").classList.toggle("danger", on);
        };

        const render = (next) => {
          Object.assign(state, next || {});
          if (state.platform) document.documentElement.dataset.platform = state.platform;
          document.body.dataset.phase = state.phase;
          const busy = state.phase === "starting" || state.phase === "running" || state.phase === "stopping";

          $("status").textContent = state.status || (state.phase === "stopping" ? "Shutting down…" : "Starting Stella…");
          $("reason").textContent = state.reason;
          $("failed-recover").textContent = state.hasKnownGood ? "Return to last working version" : "Reinstall";
          $("version").textContent = state.version || "—";

          $("return").disabled = busy || !state.hasKnownGood;
          $("return-hint").textContent = busy
            ? "Shut Stella down first."
            : state.hasKnownGood
              ? "Go back to the last version that started cleanly."
              : "No working version recorded yet.";
          $("reinstall").disabled = busy;
          $("reinstall-hint").textContent = busy ? "Shut Stella down first." : "Download Stella again. Your data stays.";
          if (busy) setConfirming(false);

          const lines = state.output || [];
          $("log").hidden = lines.length === 0;
          $("output").textContent = lines.join("\n");
        };

        const act = (action) => post({ action });
        $("start").onclick = () => act("start");
        $("retry").onclick = () => act("start");
        $("shutdown").onclick = () => act("shutdown");
        $("failed-recover").onclick = () => act(state.hasKnownGood ? "return" : "reinstall");
        $("failed-details").onclick = () => showSettings(true);
        $("open-settings").onclick = () => showSettings(true);
        $("close-settings").onclick = () => showSettings(false);
        $("open-logs").onclick = () => act("openLogs");
        $("return").onclick = () => {
          showSettings(false);
          act("return");
        };
        $("reinstall").onclick = () => {
          if (!confirmingReinstall) return setConfirming(true);
          showSettings(false);
          act("reinstall");
        };
        $("close").onclick = () => act("close");

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && settingsOpen()) showSettings(false);
          if (event.key === "Enter" && !settingsOpen() && !(event.target instanceof HTMLButtonElement)) {
            const panel = document.querySelector(`.panel[data-for~="${state.phase}"] [data-default]`);
            if (panel) panel.click();
          }
        });
        // Undecorated windows (Linux) move by dragging the background.
        document.addEventListener("mousedown", (event) => {
          if (state.platform !== "linux" || event.button !== 0) return;
          if (event.target.closest("button, pre")) return;
          act("drag");
        });
        document.addEventListener("contextmenu", (event) => event.preventDefault());

        window.stellaLauncher = { render, showSettings };
        render();
        // Fonts are data URIs; wait for them so the first frame is the real one.
        document.fonts.ready.then(() => requestAnimationFrame(() => act("loaded")));
      })();
    </script>
  </body>
</html>
