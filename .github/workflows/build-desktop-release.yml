name: Build Stella v2 Desktop Release

# This workflow is intentionally isolated from Stella v1:
#   - tags: desktop-v2-v* (v1 uses desktop-v*)
#   - R2:   desktop-v2/** (v1 uses desktop/** and desktop/current.json)
#   - feed: desktop-v2/stable/<platform>/latest-v2*.yml
# Never broaden these prefixes or publish a v2 artifact to desktop/**.

on:
  # Manual dispatch exercises the full build plus the Windows signature gate
  # without publishing; the publish job is gated on `push` below.
  push:
    tags:
      - "desktop-v2-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-v2-release-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_PUBLIC_BASE_URL: https://pub-a319aaada8144dc9be5a83625033769c.r2.dev
  STELLA_V2_RELEASE_PREFIX: desktop-v2/releases
  STELLA_V2_STABLE_PREFIX: desktop-v2/stable
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  validate_stable_tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require an exact stable semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Throwaway version for a non-publishing verification run.
            version="0.0.${GITHUB_RUN_NUMBER}"
          else
            version="${GITHUB_REF_NAME#desktop-v2-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable desktop-v2 releases require desktop-v2-vX.Y.Z; refusing: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  resolve-binary-pins:
    needs: validate_stable_tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve immutable native-helper and browser manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-pins
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/native-helpers/current.json" \
            --output release-pins/native-helpers-manifest.json
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/stella-browser/current.json" \
            --output release-pins/stella-browser-current.json
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/git-runtime/versions/2.53.0/manifest.json" \
            --output release-pins/git-runtime-manifest.json
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const current = JSON.parse(readFileSync("release-pins/stella-browser-current.json", "utf8"));
          const sha = String(current.sourceSha || "").trim();
          if (!/^[0-9a-f]{40,64}$/i.test(sha)) throw new Error("Invalid Stella Browser sourceSha");
          writeFileSync("release-pins/stella-browser-source-sha.txt", `${sha}\n`);
          NODE
          browser_sha="$(cat release-pins/stella-browser-source-sha.txt)"
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/stella-browser/${browser_sha}/manifest.json" \
            --output release-pins/stella-browser-manifest.json
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const native = JSON.parse(readFileSync("release-pins/native-helpers-manifest.json", "utf8"));
          const browser = JSON.parse(readFileSync("release-pins/stella-browser-manifest.json", "utf8"));
          const git = JSON.parse(readFileSync("release-pins/git-runtime-manifest.json", "utf8"));
          const browserSha = readFileSync("release-pins/stella-browser-source-sha.txt", "utf8").trim();
          if (native.schemaVersion !== 1) throw new Error("Unsupported native-helper manifest");
          if (browser.sourceSha !== browserSha) throw new Error("Stella Browser immutable manifest mismatch");
          if (git.schemaVersion !== 1 || git.version !== "2.53.0") throw new Error("Unsupported Git runtime manifest");
          for (const platform of ["darwin-arm64", "darwin-x64", "win-x64"]) {
            if (!native.assets?.[platform]) throw new Error(`Missing native-helper pin for ${platform}`);
            if (!browser.assets?.[platform]) throw new Error(`Missing Stella Browser pin for ${platform}`);
            if (!git.assets?.[platform]) throw new Error(`Missing Git runtime pin for ${platform}`);
          }
          // Linux (beta) needs only the browser CLI pin: no native helpers are
          // built for linux and the AppImage relies on system git.
          if (!browser.assets?.["linux-x64"]) throw new Error("Missing Stella Browser pin for linux-x64");
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: stella-v2-release-pins
          path: release-pins
          retention-days: 7

  build-desktop-js:
    needs: validate_stable_tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-install-v1-1.4.0-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        env:
          STELLA_SKIP_BROWSER_HYDRATE: "1"
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Build and validate shared desktop JavaScript
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://intent-jackal-330.convex.cloud' }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL || 'https://intent-jackal-330.convex.site' }}
          # Repository variables can move a reviewed release to a replacement
          # stack. Until then, releases target the provisioned Intent stack.
          VITE_STELLA_APPS_HOST: ${{ vars.VITE_STELLA_APPS_HOST || 'https://stella-v2-apps-host-prod.lolruuxi.workers.dev' }}
        shell: bash
        run: |
          set -euo pipefail
          node packages/desktop/scripts/validate-cloud-apps-host.mjs
          bun run build
          bun run electron:typecheck
          node packages/desktop/scripts/dev-electron-build.mjs --once

      - name: Archive shared desktop JavaScript
        shell: bash
        run: |
          set -euo pipefail
          tar -czf stella-v2-desktop-js.tar.gz \
            packages/desktop-ui/dist \
            packages/desktop/dist-electron

      - name: Upload shared desktop JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: stella-v2-desktop-js
          path: stella-v2-desktop-js.tar.gz
          retention-days: 7
          if-no-files-found: error

  build:
    needs:
      - validate_stable_tag
      - resolve-binary-pins
      - build-desktop-js
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            sourcePlatform: darwin-arm64
            nativeDir: darwin
            builderArgs: --mac --arm64
          - os: macos-latest
            platform: mac-x64
            sourcePlatform: darwin-x64
            nativeDir: darwin
            builderArgs: --mac --x64
          - os: windows-latest
            platform: win-x64
            sourcePlatform: win-x64
            nativeDir: win32
            builderArgs: --win --x64
          - os: ubuntu-latest
            platform: linux-x64
            sourcePlatform: linux-x64
            nativeDir: linux
            builderArgs: --linux AppImage pacman --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-install-v1-1.4.0-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Restore Electron packaging tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-v2-electron-tools-v1-${{ matrix.platform }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            libcrypt1 \
            libarchive-tools \
            libx11-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxt-dev \
            libxtst-dev \
            xz-utils

      - name: Install dependencies
        env:
          STELLA_SKIP_BROWSER_HYDRATE: "1"
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun ./node_modules/electron/install.js

      - uses: actions/download-artifact@v4
        with:
          name: stella-v2-release-pins
          path: release-pins

      - name: Restore immutable bundled inputs
        uses: actions/cache@v4
        with:
          path: |
            packages/native/out/${{ matrix.nativeDir }}
            packages/stella-browser/out/${{ matrix.sourcePlatform }}
            packages/stella-office/bin
          key: desktop-v2-inputs-v1-${{ matrix.sourcePlatform }}-${{ hashFiles('release-pins/native-helpers-manifest.json', 'release-pins/stella-browser-manifest.json', 'packages/stella-office/package.json', 'packages/stella-office/scripts/download-native.js', 'packages/stella-office/scripts/shared.js') }}

      - name: Hydrate pinned native helpers, Stella Browser, and OfficeCLI
        shell: bash
        run: |
          set -euo pipefail
          browser_sha="$(cat release-pins/stella-browser-source-sha.txt)"
          node packages/desktop/scripts/download-native-helpers.mjs \
            --manifest-file release-pins/native-helpers-manifest.json \
            --platform "${{ matrix.sourcePlatform }}"
          test -f "packages/native/out/${{ matrix.nativeDir }}/.stella-native-helpers.json"
          node packages/desktop/scripts/download-stella-browser.mjs \
            --manifest-file release-pins/stella-browser-manifest.json \
            --expected-source-sha "$browser_sha" \
            --platform "${{ matrix.sourcePlatform }}"
          test -f "packages/stella-browser/out/${{ matrix.sourcePlatform }}/.stella-browser.json"
          node packages/stella-office/scripts/download-native.js \
            --platform "${{ matrix.sourcePlatform }}"
          test -f packages/stella-office/bin/.stella-office.json

      - name: Restore managed command-line runtimes
        id: managed-runtimes-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/desktop/resources/bun/current
            packages/desktop/resources/git/current
            packages/desktop/resources/node/current
            packages/desktop/resources/python/current
          key: desktop-v2-runtimes-v1-${{ matrix.sourcePlatform }}-${{ hashFiles('packages/desktop/scripts/prepare-packaged-runtimes.mjs', 'release-pins/git-runtime-manifest.json') }}

      - name: Prepare managed command-line runtimes
        if: steps.managed-runtimes-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run packaging:prepare-runtimes -- \
            --platform "${{ matrix.sourcePlatform }}" \
            --git-manifest-file release-pins/git-runtime-manifest.json

      - name: Download shared desktop JavaScript
        uses: actions/download-artifact@v4
        with:
          name: stella-v2-desktop-js
          path: shared-desktop-js

      - name: Extract shared desktop JavaScript
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf shared-desktop-js/stella-v2-desktop-js.tar.gz

      # The DigiCert client-authentication certificate is a real PKCS#12 file,
      # so it is stored base64-encoded as a secret and only ever materialized
      # in RUNNER_TEMP (cleaned up in the always() step at the end of the job).
      - name: Reconstruct DigiCert client authentication certificate
        if: runner.os == 'Windows'
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "stella-digicert-client-auth.p12"
          $certificateBytes = [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "SM_CLIENT_CERT_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Pinned to a commit SHA: this action installs signing tooling, so a
      # mutable tag would be an unreviewed code path with key access.
      - name: Install DigiCert Software Trust Manager tools
        if: runner.os == 'Windows'
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      # `certsync` can pull down more than one certificate for an account, so
      # the approved one is pinned by thumbprint, serial, and publisher before
      # anything is signed with it.
      - name: Synchronize and select the approved DigiCert certificate
        if: runner.os == 'Windows'
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
          EXPECTED_THUMBPRINT: ${{ vars.STELLA_WINDOWS_CERT_SHA1 }}
          EXPECTED_SERIAL: ${{ vars.STELLA_WINDOWS_CERT_SERIAL }}
        shell: pwsh
        run: |
          # smctl writes progress to stderr; without this, PowerShell 7 would
          # treat that as a terminating error before $LASTEXITCODE is checked.
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Output "::add-mask::$env:SM_KEYPAIR_ALIAS"
          Write-Output "::add-mask::$env:EXPECTED_THUMBPRINT"
          $syncOutput = & smctl windows certsync --keypair-alias $env:SM_KEYPAIR_ALIAS 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "DigiCert certificate synchronization failed"
          }
          $expectedThumbprint = ($env:EXPECTED_THUMBPRINT -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()
          $expectedSerial = ($env:EXPECTED_SERIAL -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()
          $certificates = @(
            Get-ChildItem Cert:\CurrentUser\My |
              Where-Object { (($_.Thumbprint -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()) -eq $expectedThumbprint }
          )
          if ($certificates.Count -ne 1) {
            throw "Exactly one approved Windows signing certificate must be synchronized"
          }
          $certificate = $certificates[0]
          if ((($certificate.SerialNumber -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()) -ne $expectedSerial) {
            throw "The synchronized Windows signing certificate has the wrong serial number"
          }
          if ($certificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne "FromYou, LLC") {
            throw "The synchronized Windows signing certificate has the wrong publisher"
          }
          # KeyLocker keeps the private key server-side; SignTool only needs
          # the public certificate plus the keypair alias to sign through KSP.
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP "stella-windows-signing-public.cer"
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Type CERT | Out-Null
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signTool) {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signTool = Get-ChildItem $kitsRoot -Filter signtool.exe -Recurse -File |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $signTool) {
            throw "Microsoft SignTool was not found"
          }
          "STELLA_WINDOWS_PUBLIC_CERT_FILE=$publicCertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STELLA_WINDOWS_SIGNTOOL_PATH=$($signTool.Source ?? $signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Approved DigiCert certificate synchronized for this runner."

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/stella-v2-certificate.p12"
          keychain_path="$RUNNER_TEMP/stella-v2-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode -o "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS release
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          STELLA_REQUIRE_NOTARIZE: "1"
        shell: bash
        run: |
          set -euo pipefail
          signing_identity="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          test -n "$signing_identity"
          node node_modules/electron-builder/out/cli/cli.js ${{ matrix.builderArgs }} \
            --publish never \
            --config.forceCodeSigning=true \
            --config.mac.identity="$signing_identity" \
            --config.mac.notarize=false \
            --config.extraMetadata.version="${{ needs.validate_stable_tag.outputs.version }}"

      # The SM_* values are re-exported here because electron-builder spawns the
      # sign hook (packages/desktop/scripts/sign-windows.mjs) as a child
      # process, which authenticates to KeyLocker on its own.
      - name: Build Authenticode-signed Windows release
        if: runner.os == 'Windows'
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/electron-builder/out/cli/cli.js ${{ matrix.builderArgs }} \
            --publish never \
            --config.forceCodeSigning=true \
            --config.extraMetadata.version="${{ needs.validate_stable_tag.outputs.version }}"

      # Linux is deliberately unsigned for the beta: Linux packages have no
      # platform code-signing story comparable to Apple/DigiCert.
      - name: Build unsigned Linux AppImage and Arch package release
        if: runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/electron-builder/out/cli/cli.js ${{ matrix.builderArgs }} \
            --publish never \
            --config.extraMetadata.version="${{ needs.validate_stable_tag.outputs.version }}"

      - name: Verify packaged command-line runtimes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            app_path="packages/desktop/release/win-unpacked"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            app_path="packages/desktop/release/linux-unpacked"
          else
            app_path="$(find packages/desktop/release -maxdepth 2 -type d -name Stella.app -print -quit)"
          fi
          test -n "$app_path"
          node packages/desktop/scripts/verify-packaged-runtimes.mjs \
            --app "$app_path" \
            --platform "${{ matrix.sourcePlatform }}"

      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find packages/desktop/release -maxdepth 2 -type d -name Stella.app -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          entitlements_path="$RUNNER_TEMP/stella-main-entitlements.plist"
          codesign -d --entitlements :- "$app_path" 2>&1 | \
            sed -n '/^<?xml/,$p' > "$entitlements_path"
          /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.cs.allow-jit' \
            "$entitlements_path" | grep -Fx true
          /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.cs.allow-unsigned-executable-memory' \
            "$entitlements_path" | grep -Fx true
          xcrun stapler validate "$app_path"
          spctl --assess --verbose --type exec "$app_path"

      - name: Verify Windows Authenticode signatures and RFC 3161 timestamps
        if: runner.os == 'Windows'
        env:
          EXPECTED_THUMBPRINT: ${{ vars.STELLA_WINDOWS_CERT_SHA1 }}
          EXPECTED_SERIAL: ${{ vars.STELLA_WINDOWS_CERT_SERIAL }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "::add-mask::$env:EXPECTED_THUMBPRINT"
          $installers = @(Get-ChildItem packages/desktop/release/Stella-*-Windows-x64.exe)
          if ($installers.Count -ne 1) {
            throw "Exactly one Windows NSIS installer is required"
          }
          & packages/desktop/scripts/verify-windows-signatures.ps1 `
            -AppDirectory packages/desktop/release/win-unpacked `
            -InstallerPath $installers[0].FullName `
            -NativeManifestPath release-pins/native-helpers-manifest.json `
            -ExpectedThumbprint $env:EXPECTED_THUMBPRINT `
            -ExpectedSerial $env:EXPECTED_SERIAL `
            -ReportPath windows-signature-verification/report.json

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: stella-windows-signature-verification
          path: windows-signature-verification/report.json
          retention-days: 30

      - name: Stage release artifacts and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find packages/desktop/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.pkg.tar.xz' -o -name '*.blockmap' -o -name 'latest-v2*.yml' \) \
            -exec cp {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          if [ "${{ runner.os }}" = "macOS" ]; then
            test -f release-assets/latest-v2-mac.yml
            test -n "$(find release-assets -maxdepth 1 -name '*.zip' -print -quit)"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            test -f release-assets/latest-v2-linux.yml
            test -n "$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)"
            test -n "$(find release-assets -maxdepth 1 -name '*.pkg.tar.xz' -print -quit)"
          else
            test -f release-assets/latest-v2.yml
            test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stella-desktop-v2-${{ matrix.platform }}
          path: release-assets
          retention-days: 30

      - name: Cleanup temporary Apple keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi

      - name: Cleanup DigiCert client authentication certificate
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          if ($env:SM_CLIENT_CERT_FILE -and (Test-Path $env:SM_CLIENT_CERT_FILE)) {
            Remove-Item $env:SM_CLIENT_CERT_FILE -Force
          }
          if ($env:STELLA_WINDOWS_PUBLIC_CERT_FILE -and (Test-Path $env:STELLA_WINDOWS_PUBLIC_CERT_FILE)) {
            Remove-Item $env:STELLA_WINDOWS_PUBLIC_CERT_FILE -Force
          }

    # A manual dispatch verifies signing only; it must never touch R2 or cut a
    # GitHub release.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: stella-desktop-v2-*

      - name: Publish only to the isolated desktop-v2 R2 namespace
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assert_v2_prefix() {
            case "$1" in
              desktop-v2/*) ;;
              *) echo "Refusing non-v2 R2 target: $1" >&2; exit 1 ;;
            esac
          }
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto

          for platform in mac-arm64 mac-x64 win-x64 linux-x64; do
            source_dir="release-assets/stella-desktop-v2-${platform}"
            release_prefix="${STELLA_V2_RELEASE_PREFIX}/${tag}/${platform}"
            stable_prefix="${STELLA_V2_STABLE_PREFIX}/${platform}"
            assert_v2_prefix "$release_prefix"
            assert_v2_prefix "$stable_prefix"
            test -d "$source_dir"

            aws s3 cp "$source_dir/" "s3://${R2_BUCKET}/${release_prefix}/" \
              --recursive \
              --cache-control "public, max-age=31536000, immutable" \
              --endpoint-url "$R2_ENDPOINT"

            find "$source_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | \
              while IFS= read -r -d '' file; do
                aws s3 cp "$file" "s3://${R2_BUCKET}/${stable_prefix}/$(basename "$file")" \
                  --cache-control "public, max-age=31536000, immutable" \
                  --endpoint-url "$R2_ENDPOINT"
              done

            metadata="latest-v2.yml"
            if [[ "$platform" == mac-* ]]; then metadata="latest-v2-mac.yml"; fi
            if [[ "$platform" == linux-* ]]; then metadata="latest-v2-linux.yml"; fi
            test -f "$source_dir/$metadata"
            aws s3 cp "$source_dir/$metadata" \
              "s3://${R2_BUCKET}/${stable_prefix}/${metadata}" \
              --content-type "application/x-yaml" \
              --cache-control "no-cache" \
              --endpoint-url "$R2_ENDPOINT"

            # Website-friendly aliases intentionally live at the root of the
            # isolated v2 stable namespace. They are replaced on every release,
            # so the website never needs to know the package version.
            case "$platform" in
              mac-arm64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
                alias_name="Stella-darwin-arm64.dmg"
                ;;
              mac-x64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
                alias_name="Stella-darwin-x64.dmg"
                ;;
              win-x64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.exe' -print -quit)"
                alias_name="Stella.exe"
                ;;
              linux-x64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
                alias_name="Stella-linux-x64.AppImage"
                ;;
            esac
            test -n "$installer"
            alias_target="${STELLA_V2_STABLE_PREFIX}/${alias_name}"
            assert_v2_prefix "$alias_target"
            aws s3 cp "$installer" "s3://${R2_BUCKET}/${alias_target}" \
              --cache-control "no-cache" \
              --endpoint-url "$R2_ENDPOINT"

            if [[ "$platform" == "linux-x64" ]]; then
              arch_installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.pkg.tar.xz' -print -quit)"
              test -n "$arch_installer"
              arch_alias_target="${STELLA_V2_STABLE_PREFIX}/Stella-arch-x64.pkg.tar.xz"
              assert_v2_prefix "$arch_alias_target"
              aws s3 cp "$arch_installer" "s3://${R2_BUCKET}/${arch_alias_target}" \
                --cache-control "no-cache" \
                --endpoint-url "$R2_ENDPOINT"
            fi
          done

      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find release-assets -type f \
              \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.pkg.tar.xz' \) \
              -print0
          )
          test "${#files[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Verify isolated public updater metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v2-v}"
          for target in \
            mac-arm64/latest-v2-mac.yml \
            mac-x64/latest-v2-mac.yml \
            win-x64/latest-v2.yml \
            linux-x64/latest-v2-linux.yml; do
            url="${R2_PUBLIC_BASE_URL%/}/${STELLA_V2_STABLE_PREFIX}/${target}"
            metadata="$(curl --fail --show-error --silent --retry 5 --retry-delay 2 "$url")"
            printf '%s' "$metadata" | grep -F "version: $version" >/dev/null
            case "$url" in
              */desktop-v2/stable/*) ;;
              *) echo "Verification escaped the v2 feed: $url" >&2; exit 1 ;;
            esac
          done

          for installer in \
            Stella-darwin-arm64.dmg \
            Stella-darwin-x64.dmg \
            Stella.exe \
            Stella-linux-x64.AppImage \
            Stella-arch-x64.pkg.tar.xz; do
            url="${R2_PUBLIC_BASE_URL%/}/${STELLA_V2_STABLE_PREFIX}/${installer}"
            status="$(curl --fail --show-error --silent --location \
              --range 0-0 --output /dev/null --write-out '%{http_code}' \
              --retry 5 --retry-delay 2 "$url")"
            case "$status" in
              200|206) ;;
              *) echo "Installer alias was not range-readable: $url ($status)" >&2; exit 1 ;;
            esac
          done
