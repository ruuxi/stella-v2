[package]
name = "stella-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "signal", "time", "process", "fs"] }

[profile.release]
lto = "thin"
strip = true

