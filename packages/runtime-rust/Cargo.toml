[package]
name = "stella-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
stella-runtime-core = { path = "../runtime-core" }
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "signal", "time", "process", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
