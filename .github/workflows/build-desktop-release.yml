name: Build Stella v2 Desktop Release

# This workflow is intentionally isolated from Stella v1:
#   - tags: desktop-v2-v* (v1 uses desktop-v*)
#   - R2:   desktop-v2/** (v1 uses desktop/** and desktop/current.json)
#   - feed: desktop-v2/stable/<platform>/latest-v2*.yml
# Never broaden these prefixes or publish a v2 artifact to desktop/**.

on:
  push:
    tags:
      - "desktop-v2-v*"

permissions:
  contents: write

concurrency:
  group: desktop-v2-release-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_PUBLIC_BASE_URL: https://pub-a319aaada8144dc9be5a83625033769c.r2.dev
  STELLA_V2_RELEASE_PREFIX: desktop-v2/releases
  STELLA_V2_STABLE_PREFIX: desktop-v2/stable

jobs:
  validate_stable_tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require an exact stable semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v2-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable desktop-v2 releases require desktop-v2-vX.Y.Z; refusing: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  resolve-binary-pins:
    needs: validate_stable_tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve immutable native-helper and browser manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-pins
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/native-helpers/current.json" \
            --output release-pins/native-helpers-manifest.json
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/stella-browser/current.json" \
            --output release-pins/stella-browser-current.json
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/git-runtime/versions/2.53.0/manifest.json" \
            --output release-pins/git-runtime-manifest.json
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const current = JSON.parse(readFileSync("release-pins/stella-browser-current.json", "utf8"));
          const sha = String(current.sourceSha || "").trim();
          if (!/^[0-9a-f]{40,64}$/i.test(sha)) throw new Error("Invalid Stella Browser sourceSha");
          writeFileSync("release-pins/stella-browser-source-sha.txt", `${sha}\n`);
          NODE
          browser_sha="$(cat release-pins/stella-browser-source-sha.txt)"
          curl --fail --show-error --silent \
            "${R2_PUBLIC_BASE_URL%/}/stella-browser/${browser_sha}/manifest.json" \
            --output release-pins/stella-browser-manifest.json
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const native = JSON.parse(readFileSync("release-pins/native-helpers-manifest.json", "utf8"));
          const browser = JSON.parse(readFileSync("release-pins/stella-browser-manifest.json", "utf8"));
          const git = JSON.parse(readFileSync("release-pins/git-runtime-manifest.json", "utf8"));
          const browserSha = readFileSync("release-pins/stella-browser-source-sha.txt", "utf8").trim();
          if (native.schemaVersion !== 1) throw new Error("Unsupported native-helper manifest");
          if (browser.sourceSha !== browserSha) throw new Error("Stella Browser immutable manifest mismatch");
          if (git.schemaVersion !== 1 || git.version !== "2.53.0") throw new Error("Unsupported Git runtime manifest");
          for (const platform of ["darwin-arm64", "darwin-x64", "win-x64"]) {
            if (!native.assets?.[platform]) throw new Error(`Missing native-helper pin for ${platform}`);
            if (!browser.assets?.[platform]) throw new Error(`Missing Stella Browser pin for ${platform}`);
            if (!git.assets?.[platform]) throw new Error(`Missing Git runtime pin for ${platform}`);
          }
          // Linux (beta) needs only the browser CLI pin: no native helpers are
          // built for linux and the AppImage relies on system git.
          if (!browser.assets?.["linux-x64"]) throw new Error("Missing Stella Browser pin for linux-x64");
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: stella-v2-release-pins
          path: release-pins
          retention-days: 7

  build:
    needs:
      - validate_stable_tag
      - resolve-binary-pins
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            sourcePlatform: darwin-arm64
            nativeDir: darwin
            builderArgs: --mac --arm64
          - os: macos-latest
            platform: mac-x64
            sourcePlatform: darwin-x64
            nativeDir: darwin
            builderArgs: --mac --x64
          - os: windows-latest
            platform: win-x64
            sourcePlatform: win-x64
            nativeDir: win32
            builderArgs: --win --x64
          - os: ubuntu-latest
            platform: linux-x64
            sourcePlatform: linux-x64
            nativeDir: linux
            builderArgs: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            libx11-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxtst-dev

      - name: Install dependencies
        env:
          STELLA_SKIP_BROWSER_HYDRATE: "1"
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun ./node_modules/electron/install.js

      - uses: actions/download-artifact@v4
        with:
          name: stella-v2-release-pins
          path: release-pins

      - name: Hydrate pinned native helpers and Stella Browser
        shell: bash
        run: |
          set -euo pipefail
          browser_sha="$(cat release-pins/stella-browser-source-sha.txt)"
          node packages/desktop/scripts/download-native-helpers.mjs \
            --manifest-file release-pins/native-helpers-manifest.json \
            --platform "${{ matrix.sourcePlatform }}" \
            --force
          test -f "packages/native/out/${{ matrix.nativeDir }}/.stella-native-helpers.json"
          node packages/desktop/scripts/download-stella-browser.mjs \
            --manifest-file release-pins/stella-browser-manifest.json \
            --expected-source-sha "$browser_sha" \
            --platform "${{ matrix.sourcePlatform }}" \
            --force
          test -f "packages/stella-browser/out/${{ matrix.sourcePlatform }}/.stella-browser.json"

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/stella-v2-certificate.p12"
          keychain_path="$RUNNER_TEMP/stella-v2-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode -o "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build renderer, Electron main, and managed runtimes
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          bun run packaging:prepare-runtimes -- \
            --platform "${{ matrix.sourcePlatform }}" \
            --git-manifest-file release-pins/git-runtime-manifest.json
          bun run build
          bun run electron:typecheck
          node packages/desktop/scripts/dev-electron-build.mjs --once

      - name: Build signed and notarized macOS release
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          STELLA_REQUIRE_NOTARIZE: "1"
        shell: bash
        run: |
          set -euo pipefail
          signing_identity="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          test -n "$signing_identity"
          node node_modules/electron-builder/out/cli/cli.js ${{ matrix.builderArgs }} \
            --publish never \
            --config.forceCodeSigning=true \
            --config.mac.identity="$signing_identity" \
            --config.mac.notarize=false \
            --config.extraMetadata.version="${{ needs.validate_stable_tag.outputs.version }}"

      # Windows is deliberately unsigned for M4. Users will see SmartScreen
      # until the future DigiCert seam documented in PACKAGING.md is enabled.
      - name: Build unsigned Windows release
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/electron-builder/out/cli/cli.js ${{ matrix.builderArgs }} \
            --publish never \
            --config.extraMetadata.version="${{ needs.validate_stable_tag.outputs.version }}"

      # Linux is deliberately unsigned for the beta: AppImages carry no
      # platform code-signing story comparable to Apple/DigiCert.
      - name: Build unsigned Linux AppImage release
        if: runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/electron-builder/out/cli/cli.js ${{ matrix.builderArgs }} \
            --publish never \
            --config.extraMetadata.version="${{ needs.validate_stable_tag.outputs.version }}"

      - name: Verify packaged command-line runtimes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            app_path="packages/desktop/release/win-unpacked"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            app_path="packages/desktop/release/linux-unpacked"
          else
            app_path="$(find packages/desktop/release -maxdepth 2 -type d -name Stella.app -print -quit)"
          fi
          test -n "$app_path"
          node packages/desktop/scripts/verify-packaged-runtimes.mjs \
            --app "$app_path" \
            --platform "${{ matrix.sourcePlatform }}"

      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find packages/desktop/release -maxdepth 2 -type d -name Stella.app -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          entitlements_path="$RUNNER_TEMP/stella-main-entitlements.plist"
          codesign -d --entitlements :- "$app_path" 2>&1 | \
            sed -n '/^<?xml/,$p' > "$entitlements_path"
          /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.cs.allow-jit' \
            "$entitlements_path" | grep -Fx true
          /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.cs.allow-unsigned-executable-memory' \
            "$entitlements_path" | grep -Fx true
          xcrun stapler validate "$app_path"
          spctl --assess --verbose --type exec "$app_path"

      - name: Prove Windows artifact is intentionally unsigned
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/release/Stella-*-Windows-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "Missing Windows NSIS installer" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "M4 expects an unsigned Windows installer; got $($signature.Status)"
          }

      - name: Stage release artifacts and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find packages/desktop/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.blockmap' -o -name 'latest-v2*.yml' \) \
            -exec cp {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          if [ "${{ runner.os }}" = "macOS" ]; then
            test -f release-assets/latest-v2-mac.yml
            test -n "$(find release-assets -maxdepth 1 -name '*.zip' -print -quit)"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            test -f release-assets/latest-v2-linux.yml
            test -n "$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)"
          else
            test -f release-assets/latest-v2.yml
            test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stella-desktop-v2-${{ matrix.platform }}
          path: release-assets
          retention-days: 30

      - name: Cleanup temporary Apple keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: stella-desktop-v2-*

      - name: Publish only to the isolated desktop-v2 R2 namespace
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assert_v2_prefix() {
            case "$1" in
              desktop-v2/*) ;;
              *) echo "Refusing non-v2 R2 target: $1" >&2; exit 1 ;;
            esac
          }
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto

          for platform in mac-arm64 mac-x64 win-x64 linux-x64; do
            source_dir="release-assets/stella-desktop-v2-${platform}"
            release_prefix="${STELLA_V2_RELEASE_PREFIX}/${tag}/${platform}"
            stable_prefix="${STELLA_V2_STABLE_PREFIX}/${platform}"
            assert_v2_prefix "$release_prefix"
            assert_v2_prefix "$stable_prefix"
            test -d "$source_dir"

            aws s3 cp "$source_dir/" "s3://${R2_BUCKET}/${release_prefix}/" \
              --recursive \
              --cache-control "public, max-age=31536000, immutable" \
              --endpoint-url "$R2_ENDPOINT"

            find "$source_dir" -maxdepth 1 -type f ! -name '*.yml' -print0 | \
              while IFS= read -r -d '' file; do
                aws s3 cp "$file" "s3://${R2_BUCKET}/${stable_prefix}/$(basename "$file")" \
                  --cache-control "public, max-age=31536000, immutable" \
                  --endpoint-url "$R2_ENDPOINT"
              done

            metadata="latest-v2.yml"
            if [[ "$platform" == mac-* ]]; then metadata="latest-v2-mac.yml"; fi
            if [[ "$platform" == linux-* ]]; then metadata="latest-v2-linux.yml"; fi
            test -f "$source_dir/$metadata"
            aws s3 cp "$source_dir/$metadata" \
              "s3://${R2_BUCKET}/${stable_prefix}/${metadata}" \
              --content-type "application/x-yaml" \
              --cache-control "no-cache" \
              --endpoint-url "$R2_ENDPOINT"

            # Website-friendly aliases intentionally live at the root of the
            # isolated v2 stable namespace. They are replaced on every release,
            # so the website never needs to know the package version.
            case "$platform" in
              mac-arm64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
                alias_name="Stella-darwin-arm64.dmg"
                ;;
              mac-x64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
                alias_name="Stella-darwin-x64.dmg"
                ;;
              win-x64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.exe' -print -quit)"
                alias_name="Stella.exe"
                ;;
              linux-x64)
                installer="$(find "$source_dir" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
                alias_name="Stella-linux-x64.AppImage"
                ;;
            esac
            test -n "$installer"
            alias_target="${STELLA_V2_STABLE_PREFIX}/${alias_name}"
            assert_v2_prefix "$alias_target"
            aws s3 cp "$installer" "s3://${R2_BUCKET}/${alias_target}" \
              --cache-control "no-cache" \
              --endpoint-url "$R2_ENDPOINT"
          done

      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find release-assets -type f \
              \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \) \
              -print0
          )
          test "${#files[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Verify isolated public updater metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v2-v}"
          for target in \
            mac-arm64/latest-v2-mac.yml \
            mac-x64/latest-v2-mac.yml \
            win-x64/latest-v2.yml \
            linux-x64/latest-v2-linux.yml; do
            url="${R2_PUBLIC_BASE_URL%/}/${STELLA_V2_STABLE_PREFIX}/${target}"
            metadata="$(curl --fail --show-error --silent --retry 5 --retry-delay 2 "$url")"
            printf '%s' "$metadata" | grep -F "version: $version" >/dev/null
            case "$url" in
              */desktop-v2/stable/*) ;;
              *) echo "Verification escaped the v2 feed: $url" >&2; exit 1 ;;
            esac
          done

          for installer in \
            Stella-darwin-arm64.dmg \
            Stella-darwin-x64.dmg \
            Stella.exe \
            Stella-linux-x64.AppImage; do
            url="${R2_PUBLIC_BASE_URL%/}/${STELLA_V2_STABLE_PREFIX}/${installer}"
            status="$(curl --fail --show-error --silent --location \
              --range 0-0 --output /dev/null --write-out '%{http_code}' \
              --retry 5 --retry-delay 2 "$url")"
            case "$status" in
              200|206) ;;
              *) echo "Installer alias was not range-readable: $url ($status)" >&2; exit 1 ;;
            esac
          done
