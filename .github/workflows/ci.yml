name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-install

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-install-v1-1.4.0-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        env:
          STELLA_SKIP_BROWSER_HYDRATE: "1"
        run: bun install --frozen-lockfile

      - name: Check package boundaries
        run: bun run check:boundary

      - name: Build renderer
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
        run: bun run build

      - name: Typecheck Electron and preload
        run: bun run electron:typecheck

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-install-v1-1.4.0-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        env:
          STELLA_SKIP_BROWSER_HYDRATE: "1"
        run: bun install --frozen-lockfile

      - name: Typecheck Convex backend
        run: bun run backend:typecheck

      - name: Test backend
        run: bun run backend:test

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-install-v1-1.4.0-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        env:
          STELLA_SKIP_BROWSER_HYDRATE: "1"
        run: bun install --frozen-lockfile

      - name: Typecheck mobile
        run: bun run mobile:typecheck

      - name: Lint mobile
        run: bun run mobile:lint

      - name: Test mobile
        run: bun run mobile:test
