plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.stella'
version = '1.0.0'

android {
  namespace 'com.stella.cloudbrowsersession'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.14.0'
  testImplementation 'junit:junit:4.13.2'
}
