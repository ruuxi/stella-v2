<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stella — Recovery</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;500&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Manrope",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background: #111;
        color: #eee;
        -webkit-app-region: drag;
      }
      .recovery {
        text-align: center;
        max-width: 480px;
        padding: 48px 24px;
        -webkit-app-region: no-drag;
        animation: fadeIn 300ms ease both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      h2 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.9rem, 4vw, 2.8rem);
        font-weight: 450;
        letter-spacing: -0.03em;
        line-height: 1.2;
        margin-bottom: 12px;
      }
      p {
        font-size: 15px;
        color: #999;
        line-height: 1.5;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      button {
        padding: 6px 24px;
        font-family: "Manrope", sans-serif;
        font-size: 15px;
        font-weight: 500;
        border-radius: 10px;
        border: 1px solid #333;
        background: rgba(255, 255, 255, 0.04);
        color: #eee;
        cursor: default;
        transition: background 150ms;
      }
      button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
      }
      .btn-primary {
        background: #6366f1;
        color: #fff;
        border-color: #6366f1;
      }
      .btn-primary:hover:not(:disabled) {
        background: #5558e6;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .status {
        margin-top: 16px;
        font-size: 14px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="recovery">
      <h2>Something went wrong</h2>
      <p>An unexpected error occurred. Reload Stella to try again.</p>
      <div class="actions">
        <button class="btn-primary" id="restart-btn">Reload</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <script>
      const restartBtn = document.getElementById("restart-btn");
      restartBtn.addEventListener("click", () => {
        window.electronAPI?.ui.reload();
      });
    </script>
  </body>
</html>
